<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000" font-family="sans-serif">
  <defs>
    <style>
      .bg{fill:#15171c;}
      .layer{fill:rgba(255,255,255,0.025);stroke:rgba(255,255,255,0.16);stroke-dasharray:5 4;}
      .layerTtl{fill:#9fd0ff;font-size:12px;font-weight:700;}
      .node{fill:#232733;stroke:#3a4252;stroke-width:1.2;}
      .okNode{fill:#16301d;stroke:#34c759;stroke-width:1.6;}
      .nodeLabel{fill:#e8eaf0;font-size:11px;}
      .okTxt{fill:#7ee2a0;font-size:10.5px;font-weight:600;}
      .title{fill:#fff;font-size:16px;font-weight:700;}
      .sub{fill:#9aa3b2;font-size:11px;}
      .arrow{stroke:#7c8493;stroke-width:1.6;fill:none;}
      .okArrow{stroke:#34c759;stroke-width:1.8;fill:none;}
      .ah{fill:#7c8493;}
      .ahG{fill:#34c759;}
      .legend{fill:#cdd3df;font-size:10px;}
      .fixBox{fill:rgba(52,199,89,0.06);stroke:rgba(52,199,89,0.4);stroke-dasharray:4 3;}
      .fixTtl{fill:#7ee2a0;font-size:12px;font-weight:700;}
      .fixItem{fill:#cdd3df;font-size:9.8px;}
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="ah"/></marker>
    <marker id="ahG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="ahG"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="1000"/>
  <text class="title" x="24" y="30">web-element-blocker · 优化后架构</text>
  <text class="sub" x="24" y="48">关键改动：SelectionPanel 统一经 clearPanel() 清理 · 单一切口 · 触屏可进入 iframe 上下文 · 导入校验 · 影响度覆盖 structural/complex</text>

  <!-- Layer 0: Dispatch -->
  <rect class="layer" x="20" y="62" width="640" height="86" rx="14"/>
  <text class="layerTtl" x="34" y="82">① 菜单调度层</text>
  <rect class="node" x="34" y="92" width="180" height="40" rx="8"/><text class="nodeLabel" x="44" y="109">MENU_ITEMS（9 项）</text>
  <rect class="node" x="250" y="92" width="180" height="40" rx="8"/><text class="nodeLabel" x="260" y="109">_buildMenu 纯函数</text>
  <rect class="node" x="466" y="92" width="170" height="40" rx="8"/><text class="nodeLabel" x="476" y="109">PanelRegistry key→方法</text>
  <path class="arrow" d="M214,112 H246" marker-end="url(#ah)"/>
  <path class="arrow" d="M430,112 H462" marker-end="url(#ah)"/>
  <path class="arrow" d="M340,148 V176" marker-end="url(#ah)"/>

  <!-- Layer 1: Coordinator -->
  <rect class="layer" x="20" y="178" width="640" height="150" rx="14"/>
  <text class="layerTtl" x="34" y="198">② UIManager 协调器（共享状态 + 单一切口清理）</text>
  <rect class="okNode" x="34" y="206" width="200" height="34" rx="8"/><text class="okTxt" x="44" y="227">clearPanel() [全 9 面板统一入口]</text>
  <rect class="node" x="250" y="206" width="180" height="34" rx="8"/><text class="nodeLabel" x="260" y="227">showToast / _safeCall</text>
  <rect class="node" x="446" y="206" width="190" height="34" rx="8"/><text class="nodeLabel" x="456" y="227">stopSelection / _freezeNav</text>
  <rect class="node" x="34" y="250" width="602" height="62" rx="8"/>
  <text class="nodeLabel" x="44" y="270" style="font-size:10px;fill:#cdd3df;">共享实例状态：_actionPreview · _globalPreview · _overlayPreview · _iframePreview · _selectionBanner · _previewBanner · _undoStack</text>
  <text class="nodeLabel" x="44" y="290" style="font-size:10px;fill:#cdd3df;">_handleClick / _handleTouchEnd（含同源 iframe 上下文）· showActionPanel · Shadow DOM 宿主</text>
  <path class="arrow" d="M340,328 V356" marker-end="url(#ah)"/>

  <!-- Layer 2: 9 Panels -->
  <rect class="layer" x="20" y="358" width="640" height="234" rx="14"/>
  <text class="layerTtl" x="34" y="378">③ 9 个面板函数（XxxPanel.call(this) 注入 UIManager）</text>
  <rect class="okNode" x="34" y="388" width="190" height="46" rx="8"/>
  <text class="okTxt" x="44" y="405">SelectionPanel ✓</text>
  <text class="okTxt" x="44" y="421" style="font-size:9px;fill:#9be8b6;">入口改 clearPanel() + 触屏 iframe 上下文</text>
  <rect class="node" x="245" y="388" width="190" height="46" rx="8"/><text class="nodeLabel" x="255" y="405">RegexPanel</text>
  <text class="nodeLabel" x="255" y="421" style="font-size:9.5px;fill:#cdd3df;">regex 模式补 mode:'regex'</text>
  <rect class="node" x="456" y="388" width="190" height="46" rx="8"/><text class="nodeLabel" x="466" y="405">GlobalDomainPanel</text>
  <text class="nodeLabel" x="466" y="421" style="font-size:9.5px;fill:#cdd3df;">已选域名在过滤下仍可见</text>
  <rect class="node" x="34" y="444" width="190" height="46" rx="8"/><text class="nodeLabel" x="44" y="461">OverlayScanPanel</text>
  <text class="nodeLabel" x="44" y="477" style="font-size:9.5px;fill:#cdd3df;">无持久规则→即时隐藏+提示</text>
  <rect class="node" x="245" y="444" width="190" height="46" rx="8"/><text class="nodeLabel" x="255" y="461">ManagerPanel</text>
  <text class="nodeLabel" x="255" y="477" style="font-size:9.5px;fill:#cdd3df;">批量删除分隔符健壮</text>
  <rect class="node" x="456" y="444" width="190" height="46" rx="8"/><text class="nodeLabel" x="466" y="461">IframePanel</text>
  <text class="nodeLabel" x="466" y="477" style="font-size:9.5px;fill:#cdd3df;">预览用 isConnected 口径</text>
  <rect class="node" x="34" y="500" width="190" height="46" rx="8"/><text class="nodeLabel" x="44" y="517">ExportPanel</text>
  <text class="nodeLabel" x="44" y="533" style="font-size:9.5px;fill:#cdd3df;">导出</text>
  <rect class="node" x="245" y="500" width="190" height="46" rx="8"/><text class="nodeLabel" x="255" y="517">AdGuardExportPanel</text>
  <text class="nodeLabel" x="255" y="533" style="font-size:9.5px;fill:#cdd3df;">导出 AdGuard 规则</text>
  <rect class="node" x="456" y="500" width="190" height="46" rx="8"/><text class="nodeLabel" x="466" y="517">ImportPanel</text>
  <text class="nodeLabel" x="466" y="533" style="font-size:9.5px;fill:#cdd3df;">导入（存储层校验）</text>

  <!-- green unified-cleanup link -->
  <path class="okArrow" d="M129,388 C90,330 90,250 134,240" marker-end="url(#ahG)"/>
  <text class="okTxt" x="20" y="320" style="font-size:9.5px;">统一清理入口</text>

  <path class="arrow" d="M340,592 V620" marker-end="url(#ah)"/>

  <!-- Layer 3: Services -->
  <rect class="layer" x="20" y="622" width="640" height="200" rx="14"/>
  <text class="layerTtl" x="34" y="642">④ 服务层（引擎 / 存储 / 事件总线 / 帧 / 分类）</text>
  <rect class="node" x="34" y="652" width="190" height="40" rx="8"/><text class="nodeLabel" x="44" y="677">BlockEngine（CSS/正则/结构隐藏）</text>
  <rect class="okNode" x="245" y="652" width="190" height="40" rx="8"/><text class="okTxt" x="255" y="673">StorageService</text>
  <text class="okTxt" x="255" y="686" style="font-size:8.5px;fill:#9be8b6;">importAll 主键校验</text>
  <rect class="node" x="456" y="652" width="190" height="40" rx="8"/><text class="nodeLabel" x="466" y="677">EventBus（横切解耦缝）</text>
  <rect class="node" x="34" y="702" width="190" height="40" rx="8"/><text class="nodeLabel" x="44" y="727">OverlayService</text>
  <rect class="node" x="245" y="702" width="190" height="40" rx="8"/><text class="nodeLabel" x="255" y="727">IframeGuard / Frame*</text>
  <rect class="okNode" x="456" y="702" width="190" height="40" rx="8"/><text class="okTxt" x="466" y="723">ContentClassifier</text>
  <text class="okTxt" x="466" y="736" style="font-size:8.5px;fill:#9be8b6;">影响度覆盖 structural/complex</text>
  <rect class="node" x="34" y="752" width="190" height="40" rx="8"/><text class="nodeLabel" x="44" y="777">ProtectedCheck（UI 保护）</text>
  <rect class="node" x="245" y="752" width="190" height="40" rx="8"/><text class="nodeLabel" x="255" y="777">RuleDomain（影响度/AdGuard）</text>
  <rect class="node" x="456" y="752" width="190" height="40" rx="8"/><text class="nodeLabel" x="466" y="777">MessageGuard</text>

  <!-- Fixes summary band -->
  <rect class="fixBox" x="20" y="838" width="640" height="148" rx="12"/>
  <text class="fixTtl" x="34" y="860">已修复清单（10 项 · jest 181/181 通过）</text>
  <text class="fixItem" x="34" y="882">#1 [Critical] SelectionPanel 入口改 clearPanel() → 消除"预览元素永久隐藏 + 孤儿面板残留"</text>
  <text class="fixItem" x="34" y="900">#5 [Important] _handleTouchEnd 解析 iframe 内元素 + 触屏进入同源 iframe 上下文</text>
  <text class="fixItem" x="34" y="918">#7 [Important] 全局域名"只看广告相关"下保留已勾选域 → 消除"选中不可见"</text>
  <text class="fixItem" x="34" y="936">#8 [Important] 覆盖层拦截无持久规则时仅即时隐藏并明确提示，杜绝刷新复活假象</text>
  <text class="fixItem" x="34" y="954">#9 [Important] 影响度评估纳入 structural/complex → 误杀红警不再盲区</text>
  <text class="fixItem" x="34" y="972">#10/#16/#18 [Minor·Important] iframe 预览用 isConnected；regex 补 mode；importAll 主键校验；Toast 下移+数量上限</text>

  <text class="legend" x="34" y="996">图例：</text>
  <rect class="okNode" x="74" y="986" width="14" height="14" rx="3"/><text class="legend" x="94" y="998">已修复/统一</text>
  <rect class="node" x="200" y="986" width="14" height="14" rx="3"/><text class="legend" x="220" y="998">未改动模块</text>
  <path class="okArrow" d="M340,993 H358" marker-end="url(#ahG)"/><text class="legend" x="364" y="998">优化链路</text>
</svg>
