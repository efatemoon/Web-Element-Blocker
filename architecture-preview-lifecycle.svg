<svg viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>预览态生命周期契约（5 类预览态 × 5 阶段）</title>
  <desc>5 类预览态：_actionPreview / _previewAffectedElements / _globalPreview / _overlayPreview / _iframePreview。5 阶段：进入（校验+置位+横幅）→ 联动（选择实时更新）→ 重扫（wasPreview→reset→scan→restore）→ 重绘（保留滚动）→ 还原（clearPanel 兜底）。隐藏缺陷全部落在「进入校验 / 重扫复原 / 重绘滚动」三处断裂点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A988F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .lab{fill:#9A988F;font-size:11px;}
    .tt{fill:#ECECEE;font-size:12px;font-weight:500;}
    .ts{fill:#C9C7C0;font-size:10px;}
    .box{stroke:#B4B2A9;stroke-width:0.5;}
    .edge{fill:none;stroke:#8A8880;stroke-width:1;}
  </style>

  <text class="tt" x="340" y="28" text-anchor="middle" font-size="14">预览态生命周期契约：5 类预览态 × 5 阶段</text>
  <text class="lab" x="340" y="46" text-anchor="middle">隐藏缺陷全部落在「进入校验 / 重扫复原 / 重绘滚动」三处断裂点</text>

  <text class="ts" x="30" y="74">阶段</text>
  <g>
    <rect x="30" y="80" width="120" height="64" rx="8" class="box" fill="#3C3489"/>
    <text class="tt" x="90" y="104" text-anchor="middle">进入</text>
    <text class="ts" x="90" y="122" text-anchor="middle">校验+置位+横幅</text>
  </g>
  <g>
    <rect x="158" y="80" width="120" height="64" rx="8" class="box" fill="#534AB7"/>
    <text class="tt" x="218" y="104" text-anchor="middle">联动</text>
    <text class="ts" x="218" y="122" text-anchor="middle">选择实时更新</text>
  </g>
  <g>
    <rect x="286" y="80" width="120" height="64" rx="8" class="box" fill="#633806"/>
    <text class="tt" x="346" y="104" text-anchor="middle">重扫</text>
    <text class="ts" x="346" y="122" text-anchor="middle">wasPreview→reset→scan→restore</text>
  </g>
  <g>
    <rect x="414" y="80" width="120" height="64" rx="8" class="box" fill="#712B13"/>
    <text class="tt" x="474" y="104" text-anchor="middle">重绘</text>
    <text class="ts" x="474" y="122" text-anchor="middle">保留 scrollTop</text>
  </g>
  <g>
    <rect x="542" y="80" width="120" height="64" rx="8" class="box" fill="#27500A"/>
    <text class="tt" x="602" y="104" text-anchor="middle">还原</text>
    <text class="ts" x="602" y="122" text-anchor="middle">clearPanel 兜底</text>
  </g>
  <path class="edge" d="M150 112H158" marker-end="url(#arrow)"/>
  <path class="edge" d="M278 112H286" marker-end="url(#arrow)"/>
  <path class="edge" d="M406 112H414" marker-end="url(#arrow)"/>
  <path class="edge" d="M534 112H542" marker-end="url(#arrow)"/>

  <text class="ts" x="30" y="172" fill="#F0997B">断裂点 · 已修复</text>
  <text class="tt" x="90" y="194" text-anchor="middle" font-size="11" fill="#F0997B">R1 / S1c</text>
  <text class="tt" x="346" y="194" text-anchor="middle" font-size="11" fill="#F0997B">I1 / Y6 / H1 / H2</text>
  <text class="tt" x="474" y="194" text-anchor="middle" font-size="11" fill="#F0997B">G1 / I3 / O1 / M2</text>

  <text class="lab" x="30" y="236">5 类预览态实例</text>
  <g>
    <rect x="30" y="244" width="124" height="40" rx="8" class="box" fill="#085041" fill-opacity="0.55"/>
    <text class="ts" x="92" y="268" text-anchor="middle">_actionPreview</text>
  </g>
  <g>
    <rect x="164" y="244" width="124" height="40" rx="8" class="box" fill="#085041" fill-opacity="0.55"/>
    <text class="ts" x="226" y="268" text-anchor="middle">_previewAffected</text>
  </g>
  <g>
    <rect x="298" y="244" width="124" height="40" rx="8" class="box" fill="#085041" fill-opacity="0.55"/>
    <text class="ts" x="360" y="268" text-anchor="middle">_globalPreview</text>
  </g>
  <g>
    <rect x="432" y="244" width="124" height="40" rx="8" class="box" fill="#085041" fill-opacity="0.55"/>
    <text class="ts" x="494" y="268" text-anchor="middle">_overlayPreview</text>
  </g>
  <g>
    <rect x="566" y="244" width="84" height="40" rx="8" class="box" fill="#085041" fill-opacity="0.55"/>
    <text class="ts" x="608" y="268" text-anchor="middle">_iframePrev</text>
  </g>

  <text class="lab" x="30" y="316">契约规则</text>
  <text class="ts" x="30" y="340">① 进入必须校验命中，零命中不得置位 ② 重扫前记 wasPreview，扫描后复原 ③ 重绘前后回填 scrollTop ④ clearPanel 还原全部 5 类预览态</text>
</svg>
