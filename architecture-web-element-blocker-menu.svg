<svg viewBox="0 0 680 690" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>web-element-blocker 架构全景（9 菜单项驱动）</title>
  <desc>入口 MENU_ITEMS 经 _buildMenu 与 PanelRegistry 分派到 UIManager 协调器，UIManager 注入 9 个面板模块，面板经服务端口层（OverlayService/StorageService/RuleDomain）调用引擎层（BlockEngine/OverlayScan/IframeGuard/RegexEngine/DomainAnalyzer），最终落到 StorageManager；EventBus/ProtectedCheck/CSSInjector/NetworkEngine 为横切关注点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A988F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .lab{fill:#9A988F;font-size:11px;}
    .tt{fill:#ECECEE;font-size:13px;font-weight:500;}
    .ts{fill:#C9C7C0;font-size:11px;}
    .box{stroke:#B4B2A9;stroke-width:0.5;}
    .edge{fill:none;stroke:#8A8880;stroke-width:1;}
    .dash{fill:none;stroke:#6F6E6A;stroke-width:0.8;stroke-dasharray:4 3;}
    .ldash{fill:none;stroke:#7F77DD;stroke-width:0.8;stroke-dasharray:3 3;}
  </style>

  <text class="tt" x="340" y="30" text-anchor="middle">web-element-blocker 架构全景（9 菜单项驱动）</text>
  <text class="lab" x="340" y="48" text-anchor="middle">单向无环分派链 · OCP 达标 · 横切关注点不参与分派</text>

  <text class="lab" x="44" y="78">入口层</text>
  <g>
    <rect x="60" y="86" width="150" height="46" rx="8" class="box" fill="#3C3489"/>
    <text class="tt" x="135" y="106" text-anchor="middle">MENU_ITEMS ×9</text>
    <text class="ts" x="135" y="123" text-anchor="middle">9 项菜单定义</text>
  </g>
  <g>
    <rect x="262" y="86" width="146" height="46" rx="8" class="box" fill="#3C3489"/>
    <text class="tt" x="335" y="106" text-anchor="middle">_buildMenu()</text>
    <text class="ts" x="335" y="123" text-anchor="middle">纯函数注册</text>
  </g>
  <g>
    <rect x="464" y="86" width="156" height="46" rx="8" class="box" fill="#3C3489"/>
    <text class="tt" x="542" y="106" text-anchor="middle">PanelRegistry</text>
    <text class="ts" x="542" y="123" text-anchor="middle">key→方法名</text>
  </g>
  <path class="edge" d="M210 109H262" marker-end="url(#arrow)"/>
  <path class="edge" d="M408 109H464" marker-end="url(#arrow)"/>

  <text class="lab" x="44" y="166">协调层</text>
  <g>
    <rect x="210" y="174" width="260" height="50" rx="10" class="box" fill="#534AB7"/>
    <text class="tt" x="340" y="196" text-anchor="middle">UIManager（Shadow DOM 宿主）</text>
    <text class="ts" x="340" y="213" text-anchor="middle">拖动 / 横幅 / 预览态 / 选择模式</text>
  </g>
  <path class="edge" d="M542 109V150H340 150V174" marker-end="url(#arrow)"/>

  <text class="lab" x="44" y="246">面板层（Phase-B 注入）</text>
  <rect x="60" y="254" width="560" height="104" rx="12" class="box" fill="#085041" fill-opacity="0.55"/>
  <text class="ts" x="76" y="276" fill="#9FE1CB">9 个面板模块 · 经 XPanel.call(this) 注入 this</text>
  <text class="tt" x="150" y="304" text-anchor="middle">选择</text>
  <text class="tt" x="290" y="304" text-anchor="middle">规则</text>
  <text class="tt" x="430" y="304" text-anchor="middle">域名</text>
  <text class="tt" x="540" y="304" text-anchor="middle">覆盖层</text>
  <text class="tt" x="150" y="334" text-anchor="middle">管理</text>
  <text class="tt" x="290" y="334" text-anchor="middle">iframe</text>
  <text class="tt" x="430" y="334" text-anchor="middle">导出</text>
  <text class="tt" x="540" y="334" text-anchor="middle">AdGuard</text>
  <text class="tt" x="340" y="362" text-anchor="middle">导入</text>
  <path class="edge" d="M340 224V254" marker-end="url(#arrow)"/>

  <text class="lab" x="44" y="386">服务端口层</text>
  <g>
    <rect x="60" y="394" width="170" height="48" rx="8" class="box" fill="#633806"/>
    <text class="tt" x="145" y="414" text-anchor="middle">OverlayService</text>
    <text class="ts" x="145" y="431" text-anchor="middle">覆盖层拦截端口</text>
  </g>
  <g>
    <rect x="255" y="394" width="170" height="48" rx="8" class="box" fill="#633806"/>
    <text class="tt" x="340" y="414" text-anchor="middle">StorageService</text>
    <text class="ts" x="340" y="431" text-anchor="middle">唯一写入端口</text>
  </g>
  <g>
    <rect x="450" y="394" width="170" height="48" rx="8" class="box" fill="#633806"/>
    <text class="tt" x="535" y="414" text-anchor="middle">RuleDomain</text>
    <text class="ts" x="535" y="431" text-anchor="middle">影响度+导出</text>
  </g>
  <path class="edge" d="M145 254V300H145 342V394" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 358V394" marker-end="url(#arrow)"/>
  <path class="edge" d="M535 358V394" marker-end="url(#arrow)"/>

  <text class="lab" x="44" y="466">引擎层</text>
  <g>
    <rect x="50" y="474" width="118" height="48" rx="8" class="box" fill="#712B13"/>
    <text class="tt" x="109" y="494" text-anchor="middle">BlockEngine</text>
    <text class="ts" x="109" y="511" text-anchor="middle">隐藏/扫描</text>
  </g>
  <g>
    <rect x="178" y="474" width="118" height="48" rx="8" class="box" fill="#712B13"/>
    <text class="tt" x="237" y="494" text-anchor="middle">OverlayScan</text>
    <text class="ts" x="237" y="511" text-anchor="middle">不可见层</text>
  </g>
  <g>
    <rect x="306" y="474" width="118" height="48" rx="8" class="box" fill="#712B13"/>
    <text class="tt" x="365" y="494" text-anchor="middle">IframeGuard</text>
    <text class="ts" x="365" y="511" text-anchor="middle">帧防线</text>
  </g>
  <g>
    <rect x="434" y="474" width="118" height="48" rx="8" class="box" fill="#712B13"/>
    <text class="tt" x="493" y="494" text-anchor="middle">RegexEngine</text>
    <text class="ts" x="493" y="511" text-anchor="middle">正则/文本</text>
  </g>
  <g>
    <rect x="562" y="474" width="78" height="48" rx="8" class="box" fill="#712B13"/>
    <text class="tt" x="601" y="494" text-anchor="middle">Domain</text>
    <text class="ts" x="601" y="511" text-anchor="middle">Analyzer</text>
  </g>
  <path class="edge" d="M145 442V474" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 442V474" marker-end="url(#arrow)"/>
  <path class="edge" d="M535 442V474" marker-end="url(#arrow)"/>

  <text class="lab" x="44" y="556">存储层</text>
  <g>
    <rect x="240" y="566" width="200" height="48" rx="10" class="box" fill="#27500A"/>
    <text class="tt" x="340" y="588" text-anchor="middle">StorageManager（GM 存储）</text>
    <text class="ts" x="340" y="605" text-anchor="middle">GM_getValue/setValue</text>
  </g>
  <path class="edge" d="M109 522V566" marker-end="url(#arrow)"/>
  <path class="edge" d="M237 522V566" marker-end="url(#arrow)"/>
  <path class="edge" d="M365 522V566" marker-end="url(#arrow)"/>
  <path class="edge" d="M493 522V566" marker-end="url(#arrow)"/>
  <path class="edge" d="M601 522V566" marker-end="url(#arrow)"/>

  <text class="lab" x="636" y="262" text-anchor="middle">横切</text>
  <rect x="600" y="272" width="74" height="240" rx="10" class="box" fill="#444441" fill-opacity="0.5" stroke-dasharray="4 3"/>
  <text class="tt" x="637" y="298" text-anchor="middle" font-size="11">EventBus</text>
  <text class="tt" x="637" y="338" text-anchor="middle" font-size="11">Protected</text>
  <text class="tt" x="637" y="356" text-anchor="middle" font-size="11">Check</text>
  <text class="tt" x="637" y="396" text-anchor="middle" font-size="11">CSSInj</text>
  <text class="tt" x="637" y="436" text-anchor="middle" font-size="11">Network</text>
  <text class="tt" x="637" y="454" text-anchor="middle" font-size="11">Engine</text>
  <path class="ldash" d="M620 300H562"/>
  <path class="ldash" d="M600 356H562"/>
  <path class="ldash" d="M600 396H562"/>
  <path class="ldash" d="M600 436H562"/>
</svg>
